[pytest]
# ==============================================================================
# AI-Powered Self-Healing Test Automation Framework — PyTest Configuration
# ==============================================================================

# Automatically add project root to python path for imports in CI & local
pythonpath = .

# Test discovery paths
testpaths = tests bdd api_tests etl_validation performance

# Marker definitions for selective test execution
markers =
    smoke: Quick smoke tests for CI gating
    regression: Full regression test suite
    bdd: Behavior-Driven Development (Gherkin) tests
    api: REST API contract and functional tests
    etl: ETL / database source-to-target validation tests
    performance: Performance and load regression tests
    healing: Tests that exercise the self-healing pipeline
    ai: Tests that require LLM API access

# Default options
addopts =
    -v
    --strict-markers
    --tb=short
    -p no:warnings

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# BDD feature files
bdd_features_base_dir = bdd/features

# HTML report
generatehtmlreport = reports/pytest_report.html
